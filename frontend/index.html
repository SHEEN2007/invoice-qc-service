<!DOCTYPE html>
<html>
<head>
    <title>Invoice QC Console</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        #statusBox {
            background: #1e1e1e;
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h1>Invoice QC Console</h1>

<!-- PDF UPLOAD CARD -->
<div class="card">
    <h2>Upload PDF for Extraction & Validation</h2>

    <input type="file" id="pdfFile" />
    <button onclick="uploadPDF()" style="margin-left:10px;">Upload & Validate</button>

    <div id="statusBox">Status will appear here...</div>
</div>


<!-- JSON VALIDATION CARD -->
<div class="card">
    <h2>Paste Invoice JSON for Validation</h2>

    <textarea id="jsonInput" rows="8" style="width:100%;"></textarea>
    <button onclick="validateJSON()">Validate JSON</button>

    <div id="jsonStatus"></div>
</div>


<script>
async function uploadPDF() {
    const fileInput = document.getElementById("pdfFile");
    const status = document.getElementById("statusBox");

    if (!fileInput.files.length) {
        status.textContent = "Please select a PDF file.";
        return;
    }

    status.textContent = "Uploading...";

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
        const res = await fetch("http://127.0.0.1:8000/upload-pdf", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        status.textContent = JSON.stringify(data, null, 2);

    } catch (err) {
        status.textContent = "Error: " + err;
    }
}


async function validateJSON() {
    const input = document.getElementById("jsonInput").value;
    const output = document.getElementById("jsonStatus");

    try {
        const jsonData = JSON.parse(input);

        const res = await fetch("http://127.0.0.1:8000/validate-json", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(jsonData)
        });

        const result = await res.json();
        output.innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;

    } catch (err) {
        output.innerHTML = `<span style='color:red;'>Error: ${err}</span>`;
    }
}
</script>

</body>
</html>
